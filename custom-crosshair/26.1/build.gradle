plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.register('generateMixin') {
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new java.net.URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            def getDesc = { Class<?> c ->
                if (c == void.class) return "V"
                if (c == boolean.class) return "Z"
                if (c == byte.class) return "B"
                if (c == char.class) return "C"
                if (c == short.class) return "S"
                if (c == int.class) return "I"
                if (c == long.class) return "J"
                if (c == float.class) return "F"
                if (c == double.class) return "D"
                if (c.isArray()) return c.getName().replace('.', '/')
                return "L" + c.getName().replace('.', '/') + ";"
            }

            def hasFill5 = { Class<?> c ->
                c.getMethods().any { m ->
                    m.name == "fill" &&
                    m.parameterCount == 5 &&
                    m.parameterTypes[0] == int.class &&
                    m.parameterTypes[1] == int.class &&
                    m.parameterTypes[2] == int.class &&
                    m.parameterTypes[3] == int.class &&
                    m.parameterTypes[4] == int.class
                }
            }

            def fillCandidates = []
            def allCrosshairMethods = []

            configurations.compileClasspath.files.each { File f ->
                if (f.name.endsWith(".jar") && f.exists()) {
                    def zip = new java.util.zip.ZipFile(f)
                    try {
                        zip.entries().each { entry ->
                            if (entry.name.startsWith("net/minecraft/client/") && entry.name.endsWith(".class")) {
                                def bytes = zip.getInputStream(entry).bytes
                                def rawAscii = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1).toLowerCase()
                                if (!rawAscii.contains("crosshair")) return

                                def className = entry.name.substring(0, entry.name.length() - 6).replace('/', '.')
                                try {
                                    def cls = Class.forName(className, false, loader)
                                    if (cls.isInterface()) return
                                    cls.getDeclaredMethods().each { m ->
                                        if (!m.isSynthetic()) {
                                            def mLower = m.name.toLowerCase()
                                            def cLower = cls.name.toLowerCase()
                                            def fillParamIdx = m.parameterTypes.findIndexOf { hasFill5(it) }
                                            if (fillParamIdx != -1 && m.returnType == void.class && (mLower.contains("crosshair") || cLower.contains("crosshair") || mLower.contains("extract") || mLower.contains("render"))) {
                                                fillCandidates << [cls: cls, method: m, gfxIdx: fillParamIdx]
                                            }
                                            if (mLower.contains("crosshair") || cLower.contains("crosshair")) {
                                                allCrosshairMethods << (cls.name + "#" + m.name + "(" + m.parameterTypes.collect { it.name }.join(", ") + ") -> " + m.returnType.name)
                                            }
                                        }
                                    }
                                } catch (Throwable ignored) {}
                            }
                        }
                    } finally {
                        zip.close()
                    }
                }
            }

            if (fillCandidates.isEmpty()) {
                throw new GradleException("No fill(int,int,int,int,int) crosshair candidate found! Discovered: " + allCrosshairMethods)
            }

            fillCandidates.sort { a, b ->
                def aScore = (a.method.name == "extractCrosshair" || a.method.name == "renderCrosshair") ? 0 :
                             (a.method.name.toLowerCase().contains("crosshair") && !a.method.name.contains('$') ? 1 :
                             (a.cls.simpleName.toLowerCase().contains("crosshair") ? 2 : 3))
                def bScore = (b.method.name == "extractCrosshair" || b.method.name == "renderCrosshair") ? 0 :
                             (b.method.name.toLowerCase().contains("crosshair") && !b.method.name.contains('$') ? 1 :
                             (b.cls.simpleName.toLowerCase().contains("crosshair") ? 2 : 3))
                if (aScore != bScore) return aScore <=> bScore
                return a.method.name.length() <=> b.method.name.length()
            }

            def chosen = fillCandidates[0]
            def targetClass = chosen.cls
            def targetMethod = chosen.method
            def gfxIdx = chosen.gfxIdx
            def graphicsParamType = targetMethod.parameterTypes[gfxIdx]

            def paramDesc = targetMethod.parameterTypes.collect { getDesc(it) }.join("")
            def fullTarget = targetMethod.name + "(" + paramDesc + ")V"

            def paramDecls = []
            targetMethod.parameterTypes.eachWithIndex { Class<?> pt, int idx ->
                def varName = (idx == gfxIdx) ? "graphics" : ("arg" + idx)
                paramDecls << (pt.getCanonicalName() + " " + varName)
            }
            paramDecls << "CallbackInfo ci"
            def paramListStr = paramDecls.join(", ")

            def widthCall = "graphics.guiWidth()"
            def heightCall = "graphics.guiHeight()"
            if (!graphicsParamType.getMethods().any { it.name == "guiWidth" && it.parameterCount == 0 }) {
                widthCall = "Minecraft.getInstance().getWindow().getGuiScaledWidth()"
                heightCall = "Minecraft.getInstance().getWindow().getGuiScaledHeight()"
            }

            def mcClass = Class.forName("net.minecraft.client.Minecraft", false, loader)
            def hitResultExpr = "mc.hitResult"
            if (!mcClass.getFields().any { it.name == "hitResult" } && mcClass.getMethods().any { it.name == "hitResult" && it.parameterCount == 0 }) {
                hitResultExpr = "mc.hitResult()"
            }

            def mixinAnnotation = '@Mixin(' + targetClass.getCanonicalName() + '.class)'
            if (targetClass.name.contains('$') || !java.lang.reflect.Modifier.isPublic(targetClass.modifiers)) {
                mixinAnnotation = '@Mixin(targets = "' + targetClass.name + '")'
            }

            println("Resolved 26.x Crosshair Target -> Class: " + targetClass.name + " | Method: " + fullTarget)

            def template = '''package com.example.crosshair.mixin;

import com.example.crosshair.CrosshairConfig;
import net.minecraft.client.Minecraft;
import net.minecraft.world.entity.LivingEntity;
import net.minecraft.world.item.Items;
import net.minecraft.world.phys.EntityHitResult;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Unique;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

__MIXIN_ANNOTATION__
public abstract class GuiMixin {
    @Unique private static final int COLOR_WHITE = 0xFFFFFFFF;

    @Inject(
        method = "__METHOD_TARGET__",
        at = @At("HEAD"),
        cancellable = true
    )
    private void onExtractCrosshair(__METHOD_PARAMS__) {
        ci.cancel();
        final CrosshairConfig cfg = CrosshairConfig.INSTANCE;
        int color = COLOR_WHITE;

        Minecraft mc = Minecraft.getInstance();
        if (__HIT_RESULT_EXPR__ instanceof EntityHitResult entityHit
                && entityHit.getEntity() instanceof LivingEntity living) {
            if (living.isBlocking() && living.getUseItem().is(Items.SHIELD)) {
                color = cfg.shieldColor;
            } else {
                color = cfg.targetColor;
            }
        }

        final int cx = __WIDTH_CALL__ / 2;
        final int cy = __HEIGHT_CALL__ / 2;
        final int s = cfg.scale;
        final int half = s / 2;

        graphics.fill(cx - 2 * s, cy - half, cx + 3 * s, cy - half + s, color);
        graphics.fill(cx - half, cy - 2 * s, cx - half + s, cy - half, color);
        graphics.fill(cx - half, cy - half + s, cx - half + s, cy + 3 * s, color);
    }
}
'''
            def outFile = file("src/main/java/com/example/crosshair/mixin/GuiMixin.java")
            outFile.parentFile.mkdirs()
            outFile.text = template
                .replace("__MIXIN_ANNOTATION__", mixinAnnotation)
                .replace("__METHOD_TARGET__", fullTarget)
                .replace("__METHOD_PARAMS__", paramListStr)
                .replace("__HIT_RESULT_EXPR__", hitResultExpr)
                .replace("__WIDTH_CALL__", widthCall)
                .replace("__HEIGHT_CALL__", heightCall)
        } finally {
            loader.close()
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateMixin'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
