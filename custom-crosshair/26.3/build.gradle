plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.register('generateMixin') {
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new java.net.URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            def guiClass = Class.forName("net.minecraft.client.gui.Gui", false, loader)
            def candidates = guiClass.getDeclaredMethods().findAll { m ->
                !m.isSynthetic() &&
                !m.name.contains('$') &&
                m.name.toLowerCase().contains("crosshair") &&
                m.returnType == void.class &&
                m.parameterTypes.any { it.name.contains("GuiGraphics") }
            }.sort { a, b ->
                def aExact = (a.name == "extractCrosshair" || a.name == "renderCrosshair") ? 0 : 1
                def bExact = (b.name == "extractCrosshair" || b.name == "renderCrosshair") ? 0 : 1
                if (aExact != bExact) return aExact <=> bExact
                return a.name.length() <=> b.name.length()
            }

            if (candidates.isEmpty()) {
                throw new GradleException("No crosshair method found in Gui! Declared methods: " + guiClass.getDeclaredMethods().collect { it.toString() })
            }

            def targetMethod = candidates[0]
            def getDesc = { Class<?> c ->
                if (c == void.class) return "V"
                if (c == boolean.class) return "Z"
                if (c == byte.class) return "B"
                if (c == char.class) return "C"
                if (c == short.class) return "S"
                if (c == int.class) return "I"
                if (c == long.class) return "J"
                if (c == float.class) return "F"
                if (c == double.class) return "D"
                if (c.isArray()) return c.getName().replace('.', '/')
                return "L" + c.getName().replace('.', '/') + ";"
            }

            def paramDesc = targetMethod.parameterTypes.collect { getDesc(it) }.join("")
            def fullTarget = targetMethod.name + "(" + paramDesc + ")V"

            def paramDecls = []
            targetMethod.parameterTypes.eachWithIndex { Class<?> pt, int idx ->
                def varName = pt.name.contains("GuiGraphics") ? "graphics" : ("arg" + idx)
                paramDecls << (pt.getCanonicalName() + " " + varName)
            }
            paramDecls << "CallbackInfo ci"
            def paramListStr = paramDecls.join(", ")

            println("Resolved 26.x Gui crosshair target: " + fullTarget)

            def template = '''package com.example.crosshair.mixin;

import com.example.crosshair.CrosshairConfig;
import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.Gui;
import net.minecraft.world.entity.LivingEntity;
import net.minecraft.world.item.Items;
import net.minecraft.world.phys.EntityHitResult;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Unique;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

@Mixin(Gui.class)
public abstract class GuiMixin {
    @Unique private static final int COLOR_WHITE = 0xFFFFFFFF;

    @Inject(
        method = "__METHOD_TARGET__",
        at = @At("HEAD"),
        cancellable = true
    )
    private void onExtractCrosshair(__METHOD_PARAMS__) {
        ci.cancel();
        final CrosshairConfig cfg = CrosshairConfig.INSTANCE;
        int color = COLOR_WHITE;

        Minecraft mc = Minecraft.getInstance();
        if (mc.hitResult instanceof EntityHitResult entityHit
                && entityHit.getEntity() instanceof LivingEntity living) {
            if (living.isBlocking() && living.getUseItem().is(Items.SHIELD)) {
                color = cfg.shieldColor;
            } else {
                color = cfg.targetColor;
            }
        }

        final int cx = graphics.guiWidth() / 2;
        final int cy = graphics.guiHeight() / 2;
        final int s = cfg.scale;
        final int half = s / 2;

        graphics.fill(cx - 2 * s, cy - half, cx + 3 * s, cy - half + s, color);
        graphics.fill(cx - half, cy - 2 * s, cx - half + s, cy - half, color);
        graphics.fill(cx - half, cy - half + s, cx - half + s, cy + 3 * s, color);
    }
}
'''
            def outFile = file("src/main/java/com/example/crosshair/mixin/GuiMixin.java")
            outFile.parentFile.mkdirs()
            outFile.text = template
                .replace("__METHOD_TARGET__", fullTarget)
                .replace("__METHOD_PARAMS__", paramListStr)
        } finally {
            loader.close()
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateMixin'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
