name: Build Mods
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-auto-sprint:
    name: "Build auto-sprint (All Versions)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile 1.21.1, 1.21.4, 1.21.11, 26.1, 26.2, 26.3
        run: |
          for v in 1.21.1 1.21.4 1.21.11 26.1 26.2 26.3; do
            (cd auto-sprint/$v && gradle build --no-daemon)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: auto-sprint
          path: |
            auto-sprint/*/build/libs/auto-sprint-*.jar
            !auto-sprint/*/build/libs/*-sources.jar

  build-custom-crosshair:
