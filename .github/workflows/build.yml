name: Build Mods
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-1-21-11:
    name: "Build 1.21.11 Mods"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Build auto-sprint (1.21.11)
        working-directory: auto-sprint/1.21.11
        run: gradle build --no-daemon

      - name: Build custom-crosshair (1.21.11)
        working-directory: custom-crosshair/1.21.11
        run: gradle build --no-daemon

      - name: Build quick-offhand (1.21.11)
        working-directory: quick-offhand/1.21.11
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: auto-sprint-1.21.11
          path: |
            auto-sprint/1.21.11/build/libs/auto-sprint-*.jar
            !auto-sprint/1.21.11/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: custom-crosshair-1.21.11
          path: |
            custom-crosshair/1.21.11/build/libs/custom-crosshair-*.jar
            !custom-crosshair/1.21.11/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: quick-offhand-1.21.11
          path: |
            quick-offhand/1.21.11/build/libs/quick-offhand-*.jar
            !quick-offhand/1.21.11/build/libs/*-sources.jar

  build-26-x:
    name: "Build 26.x Mods"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Build auto-sprint (26.x)
        working-directory: auto-sprint/26.x
        run: gradle build --no-daemon

      - name: Build custom-crosshair (26.x)
        working-directory: custom-crosshair/26.x
        run: gradle build --no-daemon

      - name: Build quick-offhand (26.x)
        working-directory: quick-offhand/26.x
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: auto-sprint-26.x
          path: |
            auto-sprint/26.x/build/libs/auto-sprint-*.jar
            !auto-sprint/26.x/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: custom-crosshair-26.x
          path: |
            custom-crosshair/26.x/build/libs/custom-crosshair-*.jar
            !custom-crosshair/26.x/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: quick-offhand-26.x
          path: |
            quick-offhand/26.x/build/libs/quick-offhand-*.jar
            !quick-offhand/26.x/build/libs/*-sources.jar
