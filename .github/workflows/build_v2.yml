name: Build Mods
on: [push, pull_request, workflow_dispatch]

jobs:
  build-1-21-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - run: cd auto-sprint/1.21.4 && gradle build --no-daemon
      - run: cd custom-crosshair/1.21.4 && gradle build --no-daemon
      - run: cd quick-offhand/1.21.4 && gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: auto-sprint-1.21.4
          path: |
            auto-sprint/1.21.4/build/libs/*.jar
            !auto-sprint/1.21.4/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: custom-crosshair-1.21.4
          path: |
            custom-crosshair/1.21.4/build/libs/*.jar
            !custom-crosshair/1.21.4/build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: quick-offhand-1.21.4
          path: |
            quick-offhand/1.21.4/build/libs/*.jar
            !quick-offhand/1.21.4/build/libs/*-sources.jar
